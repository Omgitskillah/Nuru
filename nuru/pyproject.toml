[project]
name = "core"
version = "0.1.0"
description = "Terminal CLI and desktop UI for chatting with a local Ollama model."
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.2.3",
    "mcp>=2.2.0",
    "PyQt6>=6.11.0",
    "obsidian-mcp",
    "laya-mcp",
]

[project.scripts]
nuru-cli = "core.cli:main"
nuru-ui = "core.ui:main"
nuru = "core.label_cli:main"

[tool.uv.sources]
obsidian-mcp = { workspace = true }
laya-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
