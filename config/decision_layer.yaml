# Nuru's decision layer: Laya answers typed questions, this file and the code decide what to do
# with the answers. Every threshold lives here; none live in code or in Laya.
#
# A threshold is only trusted once it has been calibrated on held-out labelled data. Until then
# its `calibration` is blank, and a decision point that uses it refuses to run in `enforce` mode
# (the config fails to load). `shadow` only logs what Laya would have done.

# SQLite decision log and labels. Relative paths are relative to the repo root. Gitignored
# (every `db/` folder is), and it never leaves this machine.
database: db/decisions.sqlite3

laya:
  device: auto              # auto | mps | cpu
  checkpoints: [english, multilingual]   # preloaded at startup, kept loaded for the process life
  revision: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851   # pinned Hugging Face commit
  offline: true             # never reach the Hub at runtime; `uv run laya-mcp-fetch` downloads

# shadow | enforce, per decision point. Everything starts in shadow; switching is a human decision.
decision_points:
  tool_gate: shadow
  assess_effort: shadow
  gate_write: shadow
  check_claim: shadow
  rerank: shadow

tool_gate:
  step_cap: 6
  default_first_read: semantic_search   # used when Laya is unsure, or down

tiers:
  order: ["off", low, medium, high, expert]
  default: high             # matches Granite's own default
  # Ollama `think` value per tier, per model. Measured 2026-09-28 on Ollama 0.34.0: granite4.2
  # renders "medium" exactly like "high" (its template only knows "low"), so they are merged.
  models:
    granite4.2:3b: {"off": false, low: low, medium: high, high: high}

expert:
  model: claude-opus-5
  daily_cap: 10             # calls per local day; the API key comes only from ANTHROPIC_API_KEY

rerank:
  top_k: 5

# min_p per question set -> question -> option (`true` for a noul question; `any` for whichever
# option Laya picked). `calibration` records when, and on how many labels (and how many of them
# held out), the value was fitted; blank means uncalibrated. rerank only sorts, so it has none.
thresholds:
  tool_gate_start:
    mode:
      answer: {min_p: 0.95, calibration: {date: null, labels: 0, held_out: 0}}
      write: {min_p: 0.80, calibration: {date: null, labels: 0, held_out: 0}}
      ask_user: {min_p: 0.90, calibration: {date: null, labels: 0, held_out: 0}}
    first_tool:
      any: {min_p: 0.70, calibration: {date: null, labels: 0, held_out: 0}}
  tool_gate_next:
    next:
      any: {min_p: 0.70, calibration: {date: null, labels: 0, held_out: 0}}
  assess_effort:
    tier:
      "off": {min_p: 0.90, calibration: {date: null, labels: 0, held_out: 0}}
      low: {min_p: 0.80, calibration: {date: null, labels: 0, held_out: 0}}
      medium: {min_p: 0.80, calibration: {date: null, labels: 0, held_out: 0}}
      high: {min_p: 0.50, calibration: {date: null, labels: 0, held_out: 0}}
      expert: {min_p: 0.80, calibration: {date: null, labels: 0, held_out: 0}}
  gate_write:
    matches_request:
      "true": {min_p: 0.85, calibration: {date: null, labels: 0, held_out: 0}}
    verdict:
      proceed: {min_p: 0.80, calibration: {date: null, labels: 0, held_out: 0}}
  check_claim:
    claims_unlogged_action:
      "true": {min_p: 0.50, calibration: {date: null, labels: 0, held_out: 0}}
    hides_failure:
      "true": {min_p: 0.50, calibration: {date: null, labels: 0, held_out: 0}}
  classify_note_type:
    note_type:
      any: {min_p: 0.70, calibration: {date: null, labels: 0, held_out: 0}}
  classify_subject:
    subject:
      any: {min_p: 0.70, calibration: {date: null, labels: 0, held_out: 0}}
