# Deterministic safeguards and local audit settings. No learned decision model.
database: nuru/.db/decisions.sqlite3
decision_points:
  step_cap: enforce
  write_checks: enforce
  watch_thinking: enforce
watch_thinking:
  check_every_tokens: 400
  budgets:
    low: 1200
    high: 4000
  repeat_min_chars: 40
  repeat_count: 3
  tail_chars: 1200
  repeat_calls: 3
tool_gate:
  step_cap: 10
tiers:
  order:
  - 'off'
  - low
  - high
  - expert
  default: low
expert:
  model: claude-opus-5
  daily_cap: 10
  at_step_cap: false
