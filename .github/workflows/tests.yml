name: Tests

on:
  # Once per change: a pull request's branch, then main when it merges. Runs cost minutes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stewardship_scale:
        description: Run model-free 1K/10K stewardship scale evaluation
        type: boolean
        default: false
      windows_run:
        description: "Short Windows-only run of one command, e.g. 'uv run --locked pytest -v nuru/tests/test_x.py' or 'cd plugins/obsidian && npm ci && npm run test:e2e'; empty runs everything"
        type: string
        default: ''

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_run && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Windows takes about 8 min for Python alone
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned Obsidian revision
        id: obsidian
        run: echo "revision=$(git rev-parse HEAD:servers/obsidian)" >> "$GITHUB_OUTPUT"

      # Pin the dependency: stewardship checks run its tests alongside Nuru's.
      - name: Check out Obsidian dependency
        uses: actions/checkout@v5
        with:
          repository: Omgitskillah/obsidian-4-llms
          ref: ${{ steps.obsidian.outputs.revision }}
          path: servers/obsidian
          # Private repositories require a token with read access to Obsidian.
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --locked

      # A file opened without an encoding is in Windows' code page there, not UTF-8.
      - name: Every file opened with an encoding
        run: uvx ruff@0.17.2 check --preview --select PLW1514 nuru/src packages/claude-access/src servers/deep-think/src servers/laya/src servers/obsidian/src

      - name: Run tests
        if: ${{ !inputs.windows_run }}
        env:
          VAULT_PATH: ${{ runner.temp }}/ci-vault
          OBSIDIAN_SEMANTIC_DB: ''
          NURU_STEWARD_ENABLED: '0'
        run: timeout 1200 uv run --locked pytest -v -o faulthandler_timeout=180 nuru/tests packages/claude-access/tests servers/deep-think/tests servers/laya/tests servers/obsidian/tests servers/obsidian/vendor/access-logging/tests --cov=nuru/src --cov=packages/claude-access/src --cov=servers/deep-think/src --cov=servers/laya/src --cov=servers/obsidian/src --cov-report=term-missing

      # The Obsidian plugin: unit tests, then end to end against the real nuru-serve over scripted
      # scenarios (nuru/tests/scripted_serve.py, run with the uv environment above), then the bundle.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Run only the chosen command
        if: inputs.windows_run
        env:
          VAULT_PATH: ${{ runner.temp }}/ci-vault
          OBSIDIAN_SEMANTIC_DB: ''
          NURU_STEWARD_ENABLED: '0'
          PYTHONFAULTHANDLER: '1'
          COMMAND: ${{ inputs.windows_run }}
        run: timeout 600 bash -c "$COMMAND"

      - name: Obsidian plugin
        if: ${{ !inputs.windows_run }}
        working-directory: plugins/obsidian
        run: |
          npm ci
          npm test
          npm run test:e2e
          npm run build

      - name: Coverage summary
        if: always() && !inputs.windows_run
        run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Model-free stewardship scale evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.stewardship_scale
        run: uv run --locked python nuru/evals/vault_steward/steward_eval.py --sizes 1000,10000 --repeats 5 --output "$RUNNER_TEMP/steward-results.json"

      - name: Save stewardship scale results
        if: always() && github.event_name == 'workflow_dispatch' && inputs.stewardship_scale
        uses: actions/upload-artifact@v7.0.2
        with:
          name: stewardship-scale-results
          path: ${{ runner.temp }}/steward-results.json
          retention-days: 7
