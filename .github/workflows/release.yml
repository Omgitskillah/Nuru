name: Release

# A version tag (0.1.0) publishes Nuru: the Obsidian plugin's files, which BRAT installs, and the Nuru
# bundle the plugin's setup downloads (release/build.py). The tag must be the plugin's and Nuru's version.
# A pull request that changes how a release is built does everything but publish.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['.github/workflows/release.yml', 'release/**', 'plugins/obsidian/build.js', 'plugins/obsidian/package*.json']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the pull request's own build code, so it can't write to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Plugin dependencies
        working-directory: plugins/obsidian
        run: npm ci && npm audit --audit-level=high

      # Bundle, then the plugin with the bundle's sha256 compiled in (what "Set up Nuru" checks
      # downloads against), then checksums of all five.
      - name: Build the bundle, the plugin and checksums
        run: |
          version="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          version="${version:-$(jq -r .version plugins/obsidian/manifest.json)}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 release/build.py bundle "$version" out
          (cd plugins/obsidian && NURU_BUNDLE="$GITHUB_WORKSPACE/out/nuru-$version.zip" npm run build)
          cp plugins/obsidian/dist/{main.js,manifest.json,styles.css} out/
          grep -q "$(sha256sum "out/nuru-$version.zip" | cut -c1-64)" out/main.js  # the bundle digest Set up Nuru checks
          python3 release/build.py checksums out
          cat out/SHA256SUMS

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      # The bundle on its own, as the setup installs it: every file Nuru needs is in it.
      - name: The bundle installs and starts
        run: |
          (cd out && sha256sum --check SHA256SUMS)
          unzip -q "out/nuru-$VERSION.zip" -d "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/nuru-$VERSION"
          test ! -e .git
          uv sync --locked
          uv run --locked nuru-serve --help

      - name: Keep the release's files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: out/
          retention-days: 1

  # A tag only: publishes exactly the files built and checked above, and runs none of their code.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          (cd out && sha256sum --check SHA256SUMS)
          ls out | sort > found
          printf '%s\n' SHA256SUMS main.js manifest.json "nuru-$VERSION.zip" styles.css | sort > expected
          diff expected found
          gh api "repos/$GITHUB_REPOSITORY/contents/release/NOTES.md?ref=$GITHUB_SHA" --jq .content | base64 -d > notes.md
          gh release create "$VERSION" out/* --repo "$GITHUB_REPOSITORY" --title "Nuru $VERSION" --notes-file notes.md
