[project]
name = "calc-mcp"
version = "0.1.0"
description = "MCP server with plain arithmetic tools, so a small local model doesn't do sums in its head"
readme = "README.md"
authors = [
    { name = "Omgitskillah", email = "clarence.alucho@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "mcp>=2.2.0",
    "access-logging",
]

[project.scripts]
calc-mcp = "calc_mcp:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
access-logging = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
