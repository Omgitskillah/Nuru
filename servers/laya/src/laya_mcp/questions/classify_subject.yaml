# Options are the subject labels the caller passes with the request - nothing is derived from the
# vault's folders or tags, so any vault layout works.
name: classify_subject
version: 1
checkpoint: multilingual
max_len: 8192
max_state_tokens: 7900
questions:
  subject:
    type: choice
    instructions: "Which subject is this `note` mainly about?"
    criteria_from: subjects
