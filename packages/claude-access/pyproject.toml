[project]
name = "claude-access"
version = "0.1.0"
description = "Shared access to Claude: one provider contract and implementation for deep-think's tools and for Nuru's main model"
authors = [
    { name = "Omgitskillah", email = "clarence.alucho@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "anthropic>=1.0.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
