[tool.uv.workspace]
members = ["packages/claude-access", "servers/obsidian", "servers/deep-think", "servers/laya", "nuru"]

[tool.pytest.ini_options]
testpaths = ["nuru/tests", "packages/claude-access/tests", "servers/deep-think/tests", "servers/laya/tests", "servers/obsidian/tests", "servers/obsidian/vendor/access-logging/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "obsidian-mcp",
    "deep-think-mcp",
    "claude-access",
    "laya-mcp",
    "access-logging",
    "core",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
obsidian-mcp = { workspace = true }
deep-think-mcp = { workspace = true }
claude-access = { workspace = true }
laya-mcp = { workspace = true }
access-logging = { path = "servers/obsidian/vendor/access-logging" }
core = { workspace = true }

# F13: the Ubuntu and Windows runs are combined (tools/coverage_gate.py), so each line counts on the
# platform where it can run. Relative paths, with Windows' separators mapped, let them merge.
[tool.coverage.run]
relative_files = true
# Every source file, so one no test imports is reported at 0%, not left out.
source = ["nuru/src", "packages/claude-access/src", "servers/deep-think/src", "servers/laya/src", "servers/obsidian/src"]

[tool.coverage.paths]
nuru = ["nuru/src", "nuru\\src"]
claude_access = ["packages/claude-access/src", "packages\\claude-access\\src"]
deep_think = ["servers/deep-think/src", "servers\\deep-think\\src"]
laya = ["servers/laya/src", "servers\\laya\\src"]
obsidian = ["servers/obsidian/src", "servers\\obsidian\\src"]
