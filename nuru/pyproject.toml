[project]
name = "core"
version = "1.0.1"
description = "Nuru: the chat service the Obsidian plugin talks to, and a terminal CLI."
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.2.3",
    "mcp>=2.2.0",
    "jsonschema>=4.26.0",
    "anyio>=4",
    "obsidian-mcp",
    "laya-mcp",
    "claude-access",
]

[project.scripts]
nuru-cli = "core.cli:main"
nuru = "core.label_cli:main"
nuru-vault-links = "core.vault_link_auditor:main"
nuru-vault-steward = "core.vault_steward:main"
nuru-serve = "core.service.server:main"

[tool.uv.sources]
obsidian-mcp = { workspace = true }
laya-mcp = { workspace = true }
claude-access = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
