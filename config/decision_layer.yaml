# Deterministic safeguards and local audit; no learned decision model.
# The database remains local and gitignored; keep existing history intact.
database: nuru/.db/decisions.sqlite3

# All three enforced since 2026-09-30, at the user's request.
decision_points:
  step_cap: enforce
  write_checks: enforce
  watch_thinking: enforce

# Check streamed reasoning for budgets and repeated sentences. Enforced signals
# stop the call and retry without thinking for one call; later calls may think again.
# Budgets are thinking tokens per call. High is above passing argument steps
# (~1,650 tokens), below runaways (5,990-8,192, 2026-09-28 shadow run).
watch_thinking:
  check_every_tokens: 400
  budgets: {low: 1200, high: 4000}
  repeat_min_chars: 40
  repeat_count: 3
  repeat_calls: 3

tool_gate:
  # Six cut off passing test 32 (7-8 rounds at low, 2026-09-29/30).
  # Beyond ten rounds, observed turns were loops (10-24 rounds).
  step_cap: 10

tiers:
  order: ["off", low, high, expert]
  default: low  # Nuru's default since 2026-09-29
  enforce: false  # Optional deterministic escalation, no learned effort classifier
  # Model-specific think values: nuru/modelfiles/profiles.yaml.

expert:
  model: claude-opus-5
  daily_cap: 10  # Calls per local day; API key only from ANTHROPIC_API_KEY
  at_step_cap: false  # Since 2026-10-05: measure Nuru without expert rescue at the cap
