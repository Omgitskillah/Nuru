# Options are the note types defined by the vault's templates (obsidian_mcp's
# frontmatter_template.TYPE_FOLDER, the same eleven the Templates README lists), filled in at
# request time so they can't drift from the server's own definition.
name: classify_note_type
version: 1
checkpoint: multilingual
max_len: 8192
max_state_tokens: 7900
questions:
  note_type:
    type: choice
    instructions: "Which kind of note is this `note`?"
    criteria_from: note_types
