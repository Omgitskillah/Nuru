name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          VAULT_PATH: /tmp/ci-vault
        run: uv run pytest -v --cov=servers --cov=nuru --cov=tools --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
